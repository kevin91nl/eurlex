[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eurlex"
version = "0.1.12"
description = "An EUR-Lex parser for Python."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "K.M.J. Jacobs", email = "kmj.jacobs@maastrichtuniversity.nl" }]
requires-python = ">=3.11"
dependencies = [
	"pandas~=3.0.1",
	"rdflib~=7.6.0",
	"defusedxml~=0.7.1",
	"requests~=2.33.0",
	"lxml~=6.0.2",
	"SPARQLWrapper~=2.0.0",
]

[project.urls]
Homepage = "https://github.com/kevin91nl/eurlex"

[project.optional-dependencies]
dev = [
	"pre-commit",
	"pytest",
	"pytest-cov",
	"pytest-readme",
	"defusedxml",
	"vulture",
]

[tool.pytest.ini_options]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C90", "TID252"]

[tool.ruff.lint.per-file-ignores]
"src/eurlex/__init__.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.11"
files = ["src/eurlex"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pyright]
typeCheckingMode = "basic"
include = ["src/eurlex"]
pythonVersion = "3.11"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
